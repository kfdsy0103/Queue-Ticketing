global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "spring"
    scrape_native_histograms: true
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ["<EC2-PRIVATE-IP>:8080"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["<EC2-PRIVATE-IP>:9100"]
