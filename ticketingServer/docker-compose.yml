# ─────────────────────────────────────────────────────────────────────────────
# 메모리 설정 개요 (t3.small = 물리 RAM 2GiB, vCPU 2)
#
# [1] 왜 메모리 제한(mem_limit)을 두는가
#     제한을 안 주면 컨테이너는 호스트 RAM 전부를 쓸 수 있다. 다 쓰는 순간
#     커널의 OOM killer 가 "호스트 전체 프로세스" 중에서 점수 높은 놈을 골라 죽인다.
#     앱이 죽을지, 로그 수집기(alloy)가 죽을지, sshd 가 죽을지 우리가 못 정한다.
#     하필 alloy 가 죽으면 장애가 난 그 순간에 로그가 끊겨 원인을 못 본다.
#     제한을 걸면 cgroup 한도에서 "그 컨테이너만" 죽으므로, 앱이 터져도
#     관측 스택은 살아남아 무슨 일이 있었는지 남는다.
#
# [2] 왜 메모리가 여러 종류로 나뉘는가
#     -Xmx 는 "힙"만 제한한다. 힙은 우리가 new 로 만든 객체가 사는 곳이고,
#     JVM 은 그 밖에도 용도가 다른 영역을 따로 잡는다. 각각 기본값이 다르고
#     일부는 아예 무제한이다.
#
#       힙             객체가 사는 곳.             -Xmx 로 제한
#       메타스페이스    클래스 정의(메서드 시그니처·어노테이션). 기본 "무제한"
#       코드 캐시       JIT 가 컴파일한 기계어.      기본 240m
#       다이렉트 메모리  힙 밖 버퍼. Netty 가 씀.    기본값 = -Xmx 와 동일
#       스레드 스택     스레드마다 하나씩.           기본 1MB × 스레드 수
#
#     그래서 -Xmx 하나만 걸어두면 실제 RSS 는 그 몇 배까지 간다.
#     예전 설정(-Xmx1024m 만 지정)은 최악의 경우 2.5GB 를 넘길 수 있었고,
#     2GiB 머신에서 그건 그냥 죽는다는 뜻이다.
#
# [3] 예산 배분 (app 컨테이너 1000m 안에서)
#       힙             320m   -Xms/-Xmx
#       메타스페이스    160m   MaxMetaspaceSize
#       코드 캐시        64m   ReservedCodeCacheSize
#       다이렉트         64m   MaxDirectMemorySize
#       스레드 스택     125m   512k × 약 250개
#       GC·JVM 내부   ~110m   직접 제어 불가. 경험적으로 남겨두는 몫
#       ─────────────────────
#       합계          ~843m   < 1000m  (여유 157m)
#
#     컨테이너 셋 합계는 1000 + 192 + 64 = 1256m 이고,
#     OS·Docker 데몬이 ~300m 를 쓰므로 2GiB 안에서 여유가 남는다.
#     모든 숫자는 실측 없이 잡은 시작값이다. 부하 테스트 후
#     jvm_memory_used_bytes / jvm_threads_live_threads 로 재조정할 것.
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    image: ${DOCKER_REPOSITORY_TICKETING}:${IMAGE_TAG_TICKETING}
    container_name: ticketing
    env_file:
      - .env
    ports:
      - "8080:8080"

    # 앱 몫. 위 [3] 예산 합계(~843m)에 여유를 얹은 값이다.
    # memswap_limit 을 mem_limit 과 같게 두면 스왑이 봉쇄된다. GC 는 힙 전체를
    # 랜덤하게 훑기 때문에 스왑으로 밀린 페이지를 계속 되읽어 STW 가 초 단위로 튄다.
    # t3 는 EBS 스왑이라 IO 버스트 크레딧까지 같이 태운다.
    # (Ubuntu EC2 AMI 는 기본적으로 스왑이 없어 지금은 사실상 무동작이지만,
    #  나중에 누가 스왑을 켜도 앱이 말려들지 않도록 미리 막아둔다.)
    mem_limit: 1000m
    memswap_limit: 1000m

    environment:
      # 컨테이너 OS 시간대. JVM 은 Dockerfile 의 -Duser.timezone 으로 이미 KST 지만,
      # docker logs 타임스탬프처럼 JVM 밖에서 찍히는 것들은 UTC 로 남는다.
      # 장애 때 로그 두 종류를 9시간 차이로 대조하지 않으려면 여기서 맞춰준다.
      TZ: Asia/Seoul

      # glibc 는 malloc 경합을 줄이려고 스레드마다 arena(힙 조각)를 파는데,
      # 최대 8 × CPU 코어 수까지 늘어난다. 실제 쓰는 양보다 RSS 가 부풀어
      # 컨테이너 한도에 먼저 걸린다. JVM 은 자체 할당자를 쓰므로 arena 를 줄여도
      # 손해가 거의 없다.
      MALLOC_ARENA_MAX: "2"

      # JVM 옵션을 이미지가 아니라 여기에 두는 이유:
      # Dockerfile ENTRYPOINT 에 박아두면 값 하나 바꾸는 데 빌드 → 푸시 →
      # Launch Template 새 버전 → ASG 롤링을 다 돌아야 한다. 환경변수로 빼면
      # userdata 만 고쳐 인스턴스만 교체하면 된다.
      #
      # 주의: JAVA_TOOL_OPTIONS 는 커맨드라인 "앞"에 붙고 HotSpot 은 뒤에 온 값이
      # 이긴다. 그래서 Dockerfile 의 -Xms/-Xmx 를 지워야 여기 값이 먹는다.
      #
      # -Xms 와 -Xmx 를 같게: 힙이 늘었다 줄었다 하면 그때마다 OS 에 메모리를
      #   돌려주고 다시 받느라 GC 가 흔들린다. 컨테이너는 어차피 한도가 정해져
      #   있으니 처음부터 다 잡고 시작하는 편이 예측 가능하다.
      # MaxMetaspaceSize=160m: 기본값이 무제한이라 클래스 로딩이 새면 컨테이너가
      #   통째로 죽을 때까지 눈치를 못 챈다. 상한을 걸면 OutOfMemoryError: Metaspace
      #   로 명확히 터져 원인이 바로 보인다.
      # ReservedCodeCacheSize=64m: 기본 240m 는 예산의 4분의 1이다. JIT 가 실제로
      #   그만큼 쓰지 않으므로 줄인다. 모자라면 "CodeCache is full" 경고가 뜬다.
      # MaxDirectMemorySize=64m: 지정하지 않으면 기본값이 -Xmx 와 같아진다.
      #   Redisson 과 Lettuce 가 둘 다 Netty 기반이라 다이렉트 버퍼를 실제로 쓰는데,
      #   힙 밖에 힙만 한 크기가 더 열려 있으면 예산 계산이 무의미해진다.
      # -Xss512k: 스레드 스택은 기본 1MB 다. tomcat threads.max 200 에
      #   Netty·스케쥴러·Hikari 를 더하면 약 250 개라 그대로 두면 250m 를 먹는다.
      #   예산에서 가장 큰 덩어리여서 절반으로 줄인다.
      # HeapDumpOnOutOfMemoryError: OOM 순간의 힙 스냅샷이 없으면 뭐가 메모리를
      #   먹었는지 사후에 알 방법이 없다. 평소 비용은 0 이다.
      JAVA_TOOL_OPTIONS: >-
        -Xms320m
        -Xmx320m
        -XX:MaxMetaspaceSize=160m
        -XX:ReservedCodeCacheSize=64m
        -XX:MaxDirectMemorySize=64m
        -Xss512k
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/dump

    volumes:
      - ./logs:/app/logs  # EC2에 로그 파일 마운트 (alloy도 동일한 바인드 마운트해야함에 유의)
      # 힙덤프 보존용. /dump 디렉토리가 없으면 덤프 생성 자체가 실패한다.
      # 주의: ASG 라 스케일인으로 인스턴스가 종료되면 EBS 와 함께 덤프도 사라진다.
      # 정말 분석해야 할 때는 해당 인스턴스에 종료 보호를 걸고 파일을 먼저 꺼내야 한다.
      - ./dump:/dump
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    environment:
      - ALLOY_ENV=prod  # alloy config에서 운영 환경을 인식하고 라벨로 활용하기 위함
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro   # alloy config 마운트
      - ./logs:/var/log/spring:ro   # spring에서 logback이 남기는 파일 로그를 읽기 위함 (app도 ./logs로 바인드 마운트했음에 유의)
    # 로그가 몰릴 때 전송 버퍼가 커질 수 있어 넉넉히 잡되, 앱 예산을 침범하지 않도록
    # 상한은 둔다. 여기서 죽으면 로그가 끊기므로 너무 조이지 않는다.
    mem_limit: 192m
    memswap_limit: 192m
    restart: unless-stopped

  node-exporter:
    depends_on:
      - app
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host # 컨테이너 내부가 아닌, 호스트 레벨의 프로세스를 보도록
    network_mode: host # 네트워크도 호스트 레벨의 네트워크를 따르도록
    # /proc 를 읽어 수치만 내보내는 단순한 프로세스라 실사용은 20m 안팎이다.
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
