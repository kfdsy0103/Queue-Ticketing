services:
  app:
    image: ${DOCKER_REPOSITORY_TICKETING}:${IMAGE_TAG_TICKETING}
    container_name: ticketing
    env_file:
      - .env
    ports:
      - "8080:8080"
    # swap에 대한 GC 방지
    mem_limit: 1200m
    memswap_limit: 1200m
    environment:
      TZ: Asia/Seoul
      # t3.small(2 vCPU / 2048MB) 메모리 예산
      #   OS+커널 250 · dockerd+containerd 120 · alloy 200 · node-exporter 64 · 페이지캐시 여유 214
      #     app 컨테이너 몫 1200MB (mem_limit).
      JAVA_TOOL_OPTIONS: >-
        -Xms640m
        -Xmx640m
        -XX:MaxMetaspaceSize=192m
        -XX:ReservedCodeCacheSize=128m
        -XX:MaxDirectMemorySize=64m
        -XX:+UseG1GC
        -XX:CompileThresholdScaling=0.1
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/dump
    volumes:
      - ./logs:/app/logs  # alloy가 읽을 수 있도록 마운트
      - ./dump:/dump
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    environment:
      - ALLOY_ENV=prod  # alloy config 에서 운영 환경을 라벨로 구분하기 위함
    mem_limit: 200m
    memswap_limit: 200m
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/spring:ro  # app 이 남긴 파일 로그를 읽는다
    restart: unless-stopped

  node-exporter:
    depends_on:
      - app
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    pid: host           # 컨테이너가 아닌 호스트 레벨 프로세스를 보도록
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
