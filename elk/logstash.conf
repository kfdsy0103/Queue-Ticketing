# 1. Input
input {
  file {
    # 도커 컨테이너 안에서 바라보는 로그 파일의 위치
    path => "/usr/share/logstash/logs/all/*.log"

    # 구동 시 파일 맨 처음부터 끝까지 Read
    start_position => "beginning"

    # 폴링 주기 1초
    stat_interval => 1
  }
}

# 2. Filter
filter {
  # message에서 로그 맨 앞의 타임스탬프(yyyy-MM-dd HH:mm:ss.SSS)만 추출하여 log_timestamp로 저장
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp}" }
  }

  # 추출한 타임스탬프를 실제 로그 발생 시각으로 파싱해 @timestamp를 덮어씀 (인덱스 날짜의 기준이 됨)
  date {
    match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
    target => "@timestamp"
    remove_field => ["log_timestamp"]
  }
}

# 3. Output
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ticketing-api-logs-%{+YYYY.MM.dd}"  # 인덱스명 날짜로
  }

  # 잘 전송되고 있는지 도커 콘솔 화면에서도 확인하기 위해 추가
  stdout { codec => rubydebug }
}