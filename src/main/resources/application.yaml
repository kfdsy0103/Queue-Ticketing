spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticketing
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379
  jwt:
    secret: large-ticketing-jwt-secret-key-local-dev-only-please-change
    expiration: 1800000

# Prometheus
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics, info, env, loggers
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted # unrestricted: 인증 없이 전체 접근 허용 / read-only: 읽기만 허용 / none: 비활성화
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ticketing  # Grafana에서 앱 식별용
      instance: spring-1      # application에 대한 인스턴스 구분용
      namespace: ticketing    # namespace