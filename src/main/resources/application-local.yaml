spring:
  datasource:
    master:
      jdbc-url: jdbc:mysql://localhost:3306/ticketing
      username: root
      password: 1234
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: master-pool
    slave:
      jdbc-url: jdbc:mysql://localhost:3306/ticketing
      username: root
      password: 1234
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: slave-pool
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379
  jwt:
    secret: large-ticketing-jwt-secret-key-local-dev-only-please-change
    expiration: 1800000
