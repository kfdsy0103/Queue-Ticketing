name: Deploy Queue

on:
  push:
    branches: [ main ]
    paths:
      - 'queueServer/**'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: deploy-queue
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Jar 빌드
        run: ./gradlew :queueServer:bootJar --no-daemon --console=plain

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: ./queueServer   # 대기열 서버쪽
          push: true
          tags: |
            ${{ secrets.DOCKER_REPOSITORY_QUEUE }}:${{ github.sha }}
            ${{ secrets.DOCKER_REPOSITORY_QUEUE }}:latest

  deploy:
    name: Jenkins 배포 트리거
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Jenkins Job 트리거
        run: |
          curl -fsS -X POST \
            "http://${{ secrets.JENKINS_HOST }}:${{ secrets.JENKINS_PORT }}/buildByToken/buildWithParameters?job=${{ secrets.JENKINS_JOB_QUEUE }}&token=${{ secrets.JENKINS_BUILD_TOKEN }}" \
            --data-urlencode "IMAGE_TAG=${{ github.sha }}"
