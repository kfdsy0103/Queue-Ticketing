name: Deploy Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  image_build_and_push:
    name: Docker 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKER_REPOSITORY }}:latest

  trigger_jenkins_deploy:
    name: Jenkins 배포 트리거
    needs: image_build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Jenkins Job 트리거
        run: |
          curl -f -X POST \
            "http://${{ secrets.JENKINS_HOST }}:${{ secrets.JENKINS_PORT }}/job/${{ secrets.JENKINS_JOB_NAME }}/buildWithParameters?token=${{ secrets.JENKINS_BUILD_TOKEN }}" \
            --data-urlencode "IMAGE_TAG=${{ github.sha }}"